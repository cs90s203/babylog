<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寶寶日誌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2.37.1">
<!-- iOS's "加入主畫面" ignores manifest.webmanifest entirely — without this tag it falls
     back to a screenshot of the page, which is why the home-screen icon looked like a
     generic web thumbnail. apple-touch-icon must be a real PNG (SVG isn't honored here). -->
<!-- Shipped PNGs are only the DEFAULT (shown before Store's settings load, or if JS never
     runs) — App._updateHomeScreenIcon() overwrites these hrefs client-side with an icon
     drawn from the signed-in family's own babyEmoji/babyPhoto, so each family's home-screen
     icon matches their own baby instead of everyone sharing one fixed image. -->
<link rel="apple-touch-icon" id="icon-152" sizes="152x152" href="icons/icon-152.png?v=2.37.1">
<link rel="apple-touch-icon" id="icon-167" sizes="167x167" href="icons/icon-167.png?v=2.37.1">
<link rel="apple-touch-icon" id="icon-180" sizes="180x180" href="icons/apple-touch-icon.png?v=2.37.1">
<meta name="theme-color" content="#FAF6EF">
<link rel="manifest" href="manifest.webmanifest">
<!-- CACHE_VER: bump this alongside every APP_VERSION change in js/app.js. The querystring
     on every local script/style below exists ONLY to force browsers (and GitHub Pages'/the
     CDN's own caching) to fetch a fresh copy on the next load — the file server sends no
     Cache-Control headers, so without a URL change, a phone can silently keep running
     JS from weeks ago even after "reopening the app" or a manual refresh (this bit
     babylog itself once during dev: a code fix looked correct in the repo but a real
     device kept running the pre-fix behavior because nothing about the request URL had
     changed). See CHANGELOG.md for the incident this was added to fix. -->
<script>window.CACHE_VER = '2.37.1';</script>
<link rel="stylesheet" href="css/style.css?v=2.37.1">
<script>
// Set the theme attribute on <html> before first paint so there's no flash of the
// wrong theme (or unstyled white) while the main scripts below are still loading.
(function () {
  try {
    var pref = localStorage.getItem('bt_local_theme') || 'auto';
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var night = pref === 'night' || (pref === 'auto' && sysDark);
    document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'day');
  }
})();
</script>
</head>
<body>
<div id="root"></div>
<!-- Plain classic scripts (no type="module") so this also works opened directly as a
     local file (file://), where browsers block ES module loading. Order matters: each
     file only references the others' globals from inside function bodies (never at
     top-level), so this load order just needs every file present before main.js runs. -->
<!-- Firebase compat SDK: exposes a global `firebase` namespace, works with plain
     <script src> tags like everything else here (no bundler/ES modules needed). Not
     version-busted like the local scripts below — it's pinned to an exact SDK version
     (12.17.0) in the URL path already, so its own URL only ever changes when that version
     number is deliberately bumped. -->
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>
<script src="js/who-data.js?v=2.37.1"></script>
<script src="js/predict.js?v=2.37.1"></script>
<script src="js/store.js?v=2.37.1"></script>
<script src="js/csv.js?v=2.37.1"></script>
<script src="js/firebase-sync.js?v=2.37.1"></script>
<script src="js/views.js?v=2.37.1"></script>
<script src="js/app.js?v=2.37.1"></script>
<script src="js/main.js?v=2.37.1"></script>
</body>
</html>
